<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Penny Finance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--tx:#e8eaf0;--mut:#8b93a7;--line:#262b36;--acc:#7b3fe4;--acc2:#a477ff;--up:#16c784;--dn:#ea3943;--warn:#f5a623}
:root[data-theme="light"]{--bg:#f4f5f8;--card:#fff;--card2:#f0f1f5;--tx:#141821;--mut:#5f6678;--line:#e3e5ec;--acc:#6001d2;--acc2:#7b3fe4;--up:#0a9e5e;--dn:#d8262f;--warn:#c27a00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:20px;letter-spacing:-.3px}.logo b{color:var(--acc2)}
.upd{font-size:11px;color:var(--mut);text-align:right}
.search{margin-top:10px;display:flex;align-items:center;background:var(--card2);border-radius:22px;padding:0 14px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);padding:10px 8px;font-size:15px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:104px}
.chip .s{font-weight:700;font-size:13px}.chip .p{font-size:13px}.chip .c{font-size:12px;font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
main{padding:0 16px}
h2{font-size:17px;margin:16px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.sig{cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tk{font-weight:800;font-size:17px}
.px{font-weight:700;font-size:16px;text-align:right}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--mut)}
.b.halol{background:rgba(22,199,132,.15);color:var(--up)}.b.harom{background:rgba(234,57,67,.15);color:var(--dn)}.b.shubhali{background:rgba(245,166,35,.15);color:var(--warn)}
.b.kind{background:rgba(123,63,228,.18);color:var(--acc2)}
.b.st-open{background:rgba(123,63,228,.12);color:var(--acc2)}.b.st-win{background:rgba(22,199,132,.15);color:var(--up)}.b.st-loss{background:rgba(234,57,67,.15);color:var(--dn)}
.lvl{margin-top:12px}
.bar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--dn) 0%,var(--card2) 33%,var(--card2) 66%,var(--up) 100%);margin:6px 0}
.dot{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--tx);border:2px solid var(--bg);transform:translateX(-50%)}
.lv{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--mut);text-align:right;font-weight:600;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}
tr.q{cursor:pointer}
.seg{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:6px 12px;border-radius:18px;font-size:12px;font-weight:600}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px}nav button.on{color:var(--acc2)}
.fear{display:flex;align-items:center;gap:14px}
.gauge{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px}
#detail{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none;padding-bottom:30px}
#detail .top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#detail .back{background:var(--card2);border:0;color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:18px}
.chart{height:360px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:12px 0;background:var(--card)}
.chart iframe{width:100%;height:100%;border:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.grid2 div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}
.pre{white-space:pre-wrap;font-size:13px;color:var(--tx)}
.disc{font-size:11px;color:var(--mut);margin:18px 0 8px;text-align:center}
.empty{color:var(--mut);text-align:center;padding:30px 0}
svg.curve{width:100%;height:120px;display:block}
.langsel{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:6px 10px;font-size:13px;font-weight:700;max-width:150px}
.grid2c{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ohlc b{color:var(--tx)}
.trbusy{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--acc);color:#fff;padding:6px 14px;border-radius:16px;font-size:12px;z-index:20;display:none}
.art img{width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:block;margin:12px 0}
.art h1{font-size:23px;line-height:1.25;margin:8px 0}.art .sum{font-size:16px;line-height:1.55;margin:12px 0}
.tvbox{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:10px 0;background:var(--card)}
.mk{cursor:pointer}
.mstate{padding:8px 16px 0;font-size:13px;font-weight:700}.mstate span{color:var(--mut);font-weight:400}
.mk{flex:0 0 auto;min-width:118px;padding:6px 12px 6px 0;margin-right:4px;border-right:1px solid var(--line)}
.mk .n{color:var(--acc2);font-weight:700;font-size:13px;white-space:nowrap}.mk .v{font-size:14px;font-weight:600;margin-top:2px;white-space:nowrap}
.hero{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);margin-bottom:12px;cursor:pointer}
.hero img{width:100%;max-height:220px;object-fit:cover;display:block}.hero .t{font-size:21px;font-weight:800;line-height:1.25;padding:12px 14px 4px}
.meta{font-size:12px;color:var(--mut);padding:0 14px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.news{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.news img{width:84px;height:64px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:var(--card2)}
.news .t{font-size:15px;font-weight:700;line-height:1.3}.news .meta{padding:4px 0 0}
.tr{border:1px solid var(--line);background:var(--card2);color:var(--acc2);border-radius:14px;padding:2px 9px;font-size:11px;font-weight:700}
.trn{color:var(--up);font-size:13px;margin-top:6px;line-height:1.35}
.tl select,.tl textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px;font-family:inherit}
.tl textarea{min-height:120px;resize:vertical}.tl .bar2{display:flex;gap:8px;align-items:center;margin:10px 0}
.tl .bar2 select{flex:1}.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;width:100%}
.btn2{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.out{min-height:110px;white-space:pre-wrap;font-size:16px;line-height:1.45}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">Penny<b>Finance</b></div><div style="display:flex;align-items:center;gap:8px"><div class="upd notr" id="upd">yuklanmoqda…</div><select id="lang" class="langsel notr"></select></div></div>
  <div class="search">🔎<input id="q" placeholder="Tiker qidirish: AAPL, PLUG…" autocomplete="off" autocapitalize="characters"></div>
</header>
<div class="mstate" id="mstate"></div><div class="strip" id="strip"></div>
<main id="main"></main>
<nav>
  <button data-tab="home" class="on"><span class="i">🏠</span>Asosiy</button>
  <button data-tab="sig"><span class="i">📡</span>Signallar</button>
  <button data-tab="mkt"><span class="i">📈</span>Bozor</button>
  <button data-tab="hal"><span class="i">☪️</span>Halol</button>
</nav>
<div id="detail"></div><div class="trbusy notr" id="trbusy">🌐 tarjima qilinmoqda…</div>
<script>
const DATA_URLS=["https://raw.githubusercontent.com/fsamigjon-rgb/pfin-9fdae8/main/data.json","data.json"];
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();if(tg.colorScheme==="light")document.documentElement.dataset.theme="light"}
else if(matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.dataset.theme="light";
let D=null,TAB="home",SF="open",MS={k:"c",d:-1},MF="all",HF="HALOL",Q="";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=v=>v==null?"—":"$"+(v<2?v.toFixed(4):v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
const pct=v=>v==null?"—":(v>0?"+":"")+v.toFixed(2)+"%";
const cls=v=>v>0?"up":v<0?"dn":"mut";
const HB={HALOL:"halol",HAROM:"harom",SHUBHALI:"shubhali"};
const STN={open:"Faol",win:"Target",loss:"Stop",timeout:"Muddat",be:"1-qism+BE"};
async function load(){
  let denied=false;
  for(const u of DATA_URLS){if(u.startsWith("__"))continue;
    try{const hd=u.startsWith("/")?{"X-Init-Data":(tg&&tg.initData)||""}:{};
      const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",headers:hd});
      if(r.status===403){denied=true;break}
      if(r.ok){D=await r.json();break}}catch(e){}}
  if(denied){$("#main").innerHTML='<div class="empty">🔒 Bu ilova faqat obunachilar uchun.<br><br>Botda «📝 Obuna bo\'lish» tugmasini bosing va ilovani bot menyusidagi «📱 Ilova» tugmasi orqali oching.</div>';$("#upd").textContent="";return}
  if(!D){$("#main").innerHTML='<div class="empty">⏳ Ma\'lumot hali kelmagan — bot birinchi ma\'lumotni 1–2 daqiqada yuboradi.<br><br>Sahifa o\'zi yangilanadi.</div>';$("#upd").textContent="";setTimeout(load,20000);return}
  $("#upd").textContent=D.updated||"";
  mstate();
  strip();render();
}
function mstate(){if(!D)return;const ic={open:"🟢",pre:"🌅",post:"🌙",closed:"🌙"}[D.market_state]||"";
  $("#mstate").innerHTML=`<span class="notr" style="color:var(--tx);font-weight:700">${esc(T("um"))}</span> <span class="notr">· ${ic} ${esc(T(D.market_state)||"")}</span>`}
function strip(){
  const fmt=v=>v==null?"—":v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:v<10?4:2});
  const src=(D.markets&&D.markets.length)?D.markets:(D.index||[]).map(x=>({n:x.t,p:x.p,c:x.c}));
  const it=src.map(x=>`<div class="mk" data-mk="${esc(x.s||x.n)}" data-mn="${esc(x.n)}"><div class="n">${esc(x.n)}</div><div class="v">${fmt(x.p)} <span class="${cls(x.c)}">${pct(x.c)}</span></div></div>`);
  if(D.fear)it.push(`<div class="mk"><div class="n">😨 Qo'rquv indeksi</div><div class="v">${Math.round(D.fear.score)}/100 <span class="mut">${esc(D.fear.label)}</span></div></div>`);
  $("#strip").innerHTML=it.join("");
  document.querySelectorAll("[data-mk]").forEach(e=>e.onclick=()=>openMarket(e.dataset.mk,e.dataset.mn));
}
function sigCard(s){
  const p=s.price||s.entry,lo=s.stop,hi=s.target,pos=Math.max(0,Math.min(100,(p-lo)/(hi-lo)*100));
  const res=s.status==="open"?pct(s.price?(s.price/s.entry-1)*100:null):pct(s.pnl);
  const rc=s.status==="open"?cls(s.price-s.entry):cls(s.pnl);
  return `<div class="card sig" data-t="${esc(s.t)}"><div class="row"><div><div class="tk">${esc(s.t)}</div><div class="mut" style="font-size:12px">${esc(s.entry_date)}${s.closed_date?" → "+esc(s.closed_date):""}</div></div>
  <div><div class="px">${money(p)}</div><div class="${rc}" style="text-align:right;font-weight:700">${res} <span class="mut" style="font-weight:400;font-size:11px">${s.status==="open"?"kirishdan":"natija"}</span></div></div></div>
  <div class="badges"><span class="b kind">${esc(s.kind_name||s.kind)}</span><span class="b st-${s.status==="open"?"open":s.pnl>0?"win":"loss"}">${STN[s.status]||s.status}${s.partial?" · 💰1-qism":""}</span>${s.halal?`<span class="b notr ${HB[s.halal]||""}">☪️ ${esc(T(s.halal))}</span>`:""}</div>
  <div class="lvl"><div class="bar"><span class="dot" style="left:${pos}%"></span></div><div class="lv"><span>🛑 ${money(lo)}</span><span>Kirish ${money(s.entry)}</span><span>🎯 ${money(hi)}</span></div></div></div>`;
}
function render(){
  if(!D){load();return}
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB));
  const m=$("#main");let h="";
  if(Q){const q=Q.toUpperCase().replace(/^\$/,"");const r=(D.quotes||[]).filter(x=>x.t.startsWith(q)).slice(0,30);
    h+=`<h2>Qidiruv: ${esc(q)}</h2>`;
    if(/^[A-Z][A-Z0-9.\-]{0,9}(:[A-Z0-9.!\-]+)?$/.test(q))h+=`<div class="card sig" id="opensym"><div class="row"><div><div class="tk notr">${esc(q)}</div><div class="mut" style="font-size:12px">📈 Grafik, narx va texnik ko'rsatkichlar</div></div><div style="font-size:22px">›</div></div></div>`;
    if(r.length)h+=`<h2 style="font-size:14px">Bot skaneridagi aksiyalar</h2>`+quoteTable(r);
    m.innerHTML=h;bind();const o=$("#opensym");if(o)o.onclick=()=>openDetail(q);return}
  if(TAB==="sig"){
    const all=D.signals||[];const L=SF==="open"?all.filter(s=>s.status==="open"):all.filter(s=>s.status!=="open");
    h+=`<h2>Bot signallari</h2><div class="seg"><button data-sf="open" class="${SF==="open"?"on":""}">Faol (${all.filter(s=>s.status==="open").length})</button><button data-sf="closed" class="${SF==="closed"?"on":""}">Yopilgan</button><button data-sf="res" class="${SF==="res"?"on":""}">🏆 Natijalar</button></div>`;
    if(SF==="res")h+=results();
    else h+=L.length?L.map(sigCard).join(""):`<div class="empty">Hozircha ${SF==="open"?"faol":"yopilgan"} signal yo'q</div>`;
  }else if(TAB==="mkt"){
    let r=(D.quotes||[]).slice();
    if(MF==="halal")r=r.filter(x=>x.h==="HALOL");if(MF==="penny")r=r.filter(x=>x.p<=5);
    r.sort((a,b)=>((a[MS.k]??-1e9)>(b[MS.k]??-1e9)?1:-1)*MS.d);
    h+=`<h2>Bozor</h2><div class="seg"><button data-mf="all" class="${MF==="all"?"on":""}">Hammasi</button><button data-mf="halal" class="${MF==="halal"?"on":""}">☪️ Halol</button><button data-mf="penny" class="${MF==="penny"?"on":""}">🪙 ≤ $5</button></div>`+quoteTable(r.slice(0,150));
  }else if(TAB==="home"){h+=newsTab()}

  else{const L=(D.halal||[]).filter(x=>x.v===HF);
    h+=`<h2>Halollik (AAOIFI + boykot)</h2><div class="seg">${["HALOL","SHUBHALI","HAROM"].map(v=>`<button data-hf="${v}" class="notr ${HF===v?"on":""}">${esc(T(v))} (${(D.halal||[]).filter(x=>x.v===v).length})</button>`).join("")}</div>`;
    h+=L.length?L.map(x=>`<div class="card q" data-t="${esc(x.t)}"><div class="row"><div class="tk">${esc(x.t)}</div><span class="b notr ${HB[x.v]}">${esc(T(x.v))}</span></div><div class="mut" style="margin-top:6px;font-size:12px">${esc(x.r)}</div></div>`).join(""):`<div class="empty">Ro'yxat bo'sh</div>`;
    h+=`<div class="disc">Halollik bot hisobi (AAOIFI mezonlari + boykot ro'yxati). Yakuniy qaror — o'zingiz va ishongan olimingizda.</div>`}
  m.innerHTML=h+`<div class="disc">⚠️ Umumiy axborot va texnik tahlil — daromad kafolati emas. Qaror va natija uchun o'zingiz javobgarsiz.</div>`;bind();
}
function ago(ts){if(!ts)return"";const s=Date.now()/1000-ts;const v=s<3600?[Math.max(1,Math.round(s/60)),"m"]:s<86400?[Math.round(s/3600),"h"]:[Math.round(s/86400),"d"];return `<span class="notr">${v[0]} ${esc(T(v[1]))}</span>`}
const NT=x=>(LANG==="uz"&&x.tu)?x.tu:(x.tr&&x.tr[LANG])?x.tr[LANG]:x.t;   // tayyor tarjima (AI / bot)
const NC=x=>((LANG==="uz"&&x.tu)||(x.tr&&x.tr[LANG]))?"notr":"";            // tayyor tarjimani qayta o'girmaslik
function newsTab(){
  const N=D.news||[];if(!N.length)return '<div class="empty">Yangiliklar yuklanmoqda…</div>';
  const a=N[0];let h=`<div class="hero" data-n="0">${a.i?`<img src="${esc(a.i)}" loading="lazy" onerror="this.remove()">`:""}<div class="t ${NC(a)}">${esc(NT(a))}</div><div class="meta"><span class="notr">${esc(a.src)}</span> · ${ago(a.ts)}${a.ai&&LANG==="uz"?' · <span class="notr">🤖 AI</span>':""}</div></div>`;
  h+=N.slice(1).map((x,i)=>`<div class="news" data-n="${i+1}"><div style="flex:1"><div class="t ${NC(x)}">${esc(NT(x))}</div><div class="meta"><span class="notr">${esc(x.src)}</span> · ${ago(x.ts)}${x.ai&&LANG==="uz"?' · <span class="notr">🤖 AI</span>':""}</div></div>${x.i?`<img src="${esc(x.i)}" loading="lazy" onerror="this.remove()">`:""}</div>`).join("");
  return h+`<div class="disc">Yangiliklar manbasi: Yahoo Finance. O'zbekcha tarjima va qisqa mazmun — AI.</div>`;
}
const LANGS=[["auto","🔎 Avto aniqlash"],["uz","🇺🇿 O'zbek"],["en","🇺🇸 Ingliz"],["ru","🇷🇺 Rus"],["ko","🇰🇷 Koreys"],["tr","🇹🇷 Turk"],["ar","🇸🇦 Arab"],["zh-CN","🇨🇳 Xitoy"],["ja","🇯🇵 Yapon"],["de","🇩🇪 Nemis"],["kk","🇰🇿 Qozoq"],["tg","🇹🇯 Tojik"]];
let TR={sl:"auto",tl:"uz",txt:"",out:""};
async function translate(q,sl,tl){
  q=q.slice(0,1800);
  try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+sl+"&tl="+tl+"&q="+encodeURIComponent(q));
    if(r.ok){const j=await r.json();return j[0].map(x=>x[0]).join("")}}catch(e){}
  try{const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q.slice(0,480))+"&langpair="+(sl==="auto"?"en":sl)+"|"+tl);
    const j=await r.json();if(j.responseData&&j.responseData.translatedText)return j.responseData.translatedText}catch(e){}
  throw new Error("x");
}
// ===== Butun saytni tanlangan tilga o'girish =====

async function applyLang(){
  if(TRBUSY){TRAGAIN=true;return}TRBUSY=true;
  try{
    const nodes=textNodes(document.body);
    navLabels();mstate();
    if(LANG==="orig"){nodes.forEach(n=>{if(n._o!=null){n.nodeValue=n._o}});const qi=$("#q");qi.placeholder="Tiker qidirish: AAPL, PLUG…";return}
    const C=TCACHE[LANG]=TCACHE[LANG]||{};
    nodes.forEach(n=>{if(n._o==null)n._o=n.nodeValue});
    const need=[...new Set(nodes.map(n=>n._o.trim()).filter(s=>s&&!(s in C)))];
    if(need.length)$("#trbusy").style.display="block";
    let chunk=[],len=0;const chunks=[];
    for(const s of need){if(len+s.length>1400&&chunk.length){chunks.push(chunk);chunk=[];len=0}chunk.push(s.replace(/\n/g," "));len+=s.length+1}
    if(chunk.length)chunks.push(chunk);
    const put=()=>nodes.forEach(n=>{const s=n._o.trim();if(C[s]!=null){const lead=n._o.match(/^\s*/)[0],tail=n._o.match(/\s*$/)[0];n.nodeValue=lead+C[s]+tail}});
    put();                                                 // keshdagi tarjima — darhol
    const one=async ch=>{try{const t=await gtxBatch(ch,LANG);ch.forEach((s,i)=>C[s]=t[i])}
      catch(e){await Promise.all(ch.slice(0,25).map(async s=>{try{C[s]=await translate(s,"auto",LANG)}catch(e2){C[s]=s}}))}put()};
    for(let k=0;k<chunks.length;k+=5)await Promise.all(chunks.slice(k,k+5).map(one));   // 5 ta parallel
    if(!C.__ph)C.__ph=await translate("Search ticker: AAPL, PLUG…","en",LANG).catch(()=>"AAPL, PLUG…");
    $("#q").placeholder=C.__ph;saveTC();

}

  <div class="grid2" style="margin-top:8px"><div><span class="mut">${TA("opn")}</span><b class="notr">${fmt(H.o[L])}</b></div><div><span class="mut">${TA("prv")}</span><b class="notr">${fmt(prev)}</b></div><div><span class="mut">${TA("dr")}</span><b class="notr">${fmt(H.l[L])} – ${fmt(H.h[L])}</b></div><div><span class="mut">${TA("yr")}</span><b class="notr">${fmt(Math.min(...yl))} – ${fmt(Math.max(...y))}</b></div></div></div>
  <div class="card"><div class="seg" id="rg">${[["r1",22],["r3",66],["r6",130],["r12",260]].map(r=>`<button data-b="${r[1]}" class="${r[1]===130?"on":""}">${TA(r[0])}</button>`).join("")}<button data-bb="1">BB</button></div>
  <div class="notr mut" style="font-size:11px;margin-bottom:4px"><span style="color:#f5a623">━ MA20</span> &nbsp;<span style="color:#4f7cf0">━ MA50</span> &nbsp;<span style="color:#a477ff">━ RSI</span></div><div id="ownc"></div></div>
  <h2>${TA("ta")}</h2><div class="card"><div class="seg" id="tf"><button data-tf="d" class="on">${TA("day")}</button><button data-tf="w">${TA("week")}</button></div><div id="tabox"></div></div>`;
  const x=document.createElement("div");x.innerHTML=h;b.appendChild(x);
  let bars=130,bbOn=false;const box=x.querySelector("#ownc");const redraw=()=>drawChart(box,H,bars,bbOn);
  requestAnimationFrame(redraw);
  x.querySelectorAll("#rg [data-b]").forEach(e=>e.onclick=()=>{bars=+e.dataset.b;x.querySelectorAll("#rg [data-b]").forEach(z=>z.classList.toggle("on",z===e));redraw()});
  x.querySelector("#rg [data-bb]").onclick=e=>{bbOn=!bbOn;e.currentTarget.classList.toggle("on",bbOn);redraw()};
  const tab=x.querySelector("#tabox");const setTF=tf=>{tab.innerHTML=taHtml(tf==="w"?toWeekly(H):H);x.querySelectorAll("#tf button").forEach(z=>z.classList.toggle("on",z.dataset.tf===tf))};
  setTF("d");x.querySelectorAll("#tf button").forEach(e=>e.onclick=()=>setTF(e.dataset.tf));
}
async function yhist(t){
  const u="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(t)+"?range=1y&interval=1d";
  for(const url of [u,"https://api.allorigins.win/raw?url="+encodeURIComponent(u),"https://corsproxy.io/?url="+encodeURIComponent(u)]){
    try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),7000);const r=await fetch(url,{signal:ctl.signal});clearTimeout(tm);if(!r.ok)continue;
      const R=(await r.json()).chart.result[0],q=R.indicators.quote[0];const o={d:[],o:[],h:[],l:[],c:[],v:[],n:R.meta.longName||R.meta.shortName||t};
      (R.timestamp||[]).forEach((ts,i)=>{if(q.close[i]==null||q.open[i]==null)return;o.d.push(new Date(ts*1000).toISOString().slice(0,10));o.o.push(q.open[i]);o.h.push(q.high[i]);o.l.push(q.low[i]);o.c.push(q.close[i]);o.v.push(q.volume[i]||0)});
      if(o.c.length>30){o.live={p:R.meta.regularMarketPrice,c:null};return o}}catch(e){}
  }
  return null}
function detailShell(name,sym){
  const d=$("#detail");d.innerHTML=`<div class="top"><button class="back">←</button><div><div class="tk notr">${esc(name||sym)}</div><div class="mut notr" style="font-size:12px">${esc(sym)}</div></div></div><div style="padding:0 16px" id="symbody"></div>`;
  d.style.display="block";d.scrollTop=0;d.querySelector(".back").onclick=closeDetail;if(tg&&tg.BackButton){tg.BackButton.show();tg.BackButton.onClick(closeDetail)}
  return $("#symbody")}
function tvView(b,sym,isIndex){
  const theme=tvTheme();
  tvWidget(b,"symbol-info",{symbol:sym,width:"100%"});
  const c=document.createElement("div");c.className="chart notr";c.innerHTML=`<iframe src="https://s.tradingview.com/widgetembed/?symbol=${encodeURIComponent(sym)}&interval=D&hidesidetoolbar=0&symboledit=1&saveimage=0&studies=%5B%22RSI%40tv-basicstudies%22%2C%22MASimple%40tv-basicstudies%22%5D&theme=${theme}&style=1&timezone=Asia%2FSeoul&withdateranges=1&locale=${tvLoc()}" allowtransparency="true"></iframe>`;b.appendChild(c);
  tvWidget(b,"technical-analysis",{symbol:sym,interval:"1D",width:"100%",height:420,showIntervalTabs:true,displayMode:"single"},420);
}
function tvExtras(b,sym){tvWidget(b,"financials",{symbol:sym,width:"100%",height:520,displayMode:"regular"},520);tvWidget(b,"symbol-profile",{symbol:sym,width:"100%",height:380},380)}
function openMarket(s,n){
  const H=D.hist&&D.hist[s];const live=(D.markets||[]).find(x=>x.s===s);const b=detailShell(n||(H&&H.n)||s,s);
  if(H&&H.c&&H.c.length>30){ownView(b,H,live);return b}
  tvView(b,tvSym(s),true);return b}
function openSymbol(sym,name,isIndex){const b=detailShell(name,sym);tvView(b,sym,isIndex);if(!isIndex)tvExtras(b,sym);return b}
async function openDetail(t){
  t=String(t||"").toUpperCase().replace(/^\$/,"").trim();if(!t)return;
  const q=(D.quotes||[]).find(x=>x.t===t);const s=(D.signals||[]).find(x=>x.t===t&&x.status==="open")||(D.signals||[]).find(x=>x.t===t);
  const hl=(D.halal||[]).find(x=>x.t===t);
  const b=detailShell(t,t);
  let ex="";
  if(q)ex+=`<div class="card grid2"><div><span class="mut">RSI</span><b>${q.rsi==null?"—":Math.round(q.rsi)}</b></div><div><span class="mut">Hajm</span><b>${q.vr==null?"—":q.vr.toFixed(1)+"x"}</b></div><div><span class="mut">20 kun</span><b class="${cls(q.r20)}">${pct(q.r20)}</b></div><div><span class="mut">Halol</span><b class="notr">${hl?esc(T(hl.v)):"—"}</b></div></div>`;
  if(s)ex+=`<h2>Bot signali</h2>`+sigCard(s);
  if(hl)ex+=`<h2>☪️ ${esc(T("hal"))}</h2><div class="card"><span class="b notr ${HB[hl.v]}">${esc(T(hl.v))}</span><div style="margin-top:8px;font-size:13px">${esc(hl.r)}</div></div>`;
  const tail=()=>{const z=document.createElement("div");z.innerHTML=ex+`<div class="disc">Batafsil tahlil va halollik uchun botga <b class="notr">${esc(t)}</b> deb yozing.<br>⚠️ Daromad kafolati emas.</div>`;b.appendChild(z)};
  let H=D.hist&&D.hist[t];
  if(!(H&&H.c&&H.c.length>30)){const w=document.createElement("div");w.className="empty";w.innerHTML=TA("load");b.appendChild(w);H=await yhist(t);w.remove();if($("#detail").style.display!=="block")return b}
  if(H&&H.c&&H.c.length>30){if(H.n)$("#detail .tk").textContent=t+" · "+H.n;ownView(b,H,H.live||(q?{p:q.p,c:q.c}:null));tail();tvExtras(b,tvSym(t));}
  else{tvView(b,tvSym(t),false);tail();tvExtras(b,tvSym(t))}
  return b;
}
function closeDetail(){$("#detail").style.display="none";if(tg&&tg.BackButton)tg.BackButton.hide()}
function bind(){
  document.querySelectorAll("[data-n]").forEach(e=>e.onclick=()=>openArticle(+e.dataset.n));

  document.querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>openDetail(e.dataset.t));
  document.querySelectorAll("[data-sf]").forEach(e=>e.onclick=()=>{SF=e.dataset.sf;render()});
  document.querySelectorAll("[data-mf]").forEach(e=>e.onclick=()=>{MF=e.dataset.mf;render()});
  document.querySelectorAll("[data-hf]").forEach(e=>e.onclick=()=>{HF=e.dataset.hf;render()});
  document.querySelectorAll("th[data-k]").forEach(e=>e.onclick=()=>{const k=e.dataset.k;MS={k,d:MS.k===k?-MS.d:(k==="t"?1:-1)};render()});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;Q="";$("#q").value="";render();scrollTo(0,0)});
$("#q").oninput=e=>{Q=e.target.value.trim();if(D)render()};
$("#q").onkeydown=e=>{if(e.key==="Enter"&&Q){e.target.blur();openDetail(Q.toUpperCase().replace(/^\$/,""))}};
load();setInterval(()=>{if($("#detail").style.display!=="block")load()},120000);
</script>
