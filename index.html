<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--tx:#e8eaf0;--mut:#8b93a7;--line:#262b36;--acc:#7b3fe4;--acc2:#a477ff;--up:#16c784;--dn:#ea3943;--warn:#f5a623}
:root[data-theme="light"]{--bg:#f4f5f8;--card:#fff;--card2:#f0f1f5;--tx:#141821;--mut:#5f6678;--line:#e3e5ec;--acc:#6001d2;--acc2:#7b3fe4;--up:#0a9e5e;--dn:#d8262f;--warn:#c27a00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:20px;letter-spacing:-.3px}.logo b{color:var(--acc2)}
.upd{font-size:12px;color:var(--mut);white-space:nowrap;flex:0 0 auto}.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.mrow .upd{padding:8px 16px 0 0}.mrow .mstate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{margin-top:10px;display:flex;align-items:center;background:var(--card2);border-radius:22px;padding:0 14px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);padding:10px 8px;font-size:15px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:104px}
.chip .s{font-weight:700;font-size:13px}.chip .p{font-size:13px}.chip .c{font-size:12px;font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
main{padding:0 16px}
h2{font-size:17px;margin:16px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.sig{cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tk{font-weight:800;font-size:17px}
.px{font-weight:700;font-size:16px;text-align:right}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--mut)}
.b.halol{background:rgba(22,199,132,.15);color:var(--up)}.b.harom{background:rgba(234,57,67,.15);color:var(--dn)}.b.shubhali{background:rgba(245,166,35,.15);color:var(--warn)}
.b.kind{background:rgba(123,63,228,.18);color:var(--acc2)}
.b.st-open{background:rgba(123,63,228,.12);color:var(--acc2)}.b.st-win{background:rgba(22,199,132,.15);color:var(--up)}.b.st-loss{background:rgba(234,57,67,.15);color:var(--dn)}
.lvl{margin-top:12px}
.bar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--dn) 0%,var(--card2) 33%,var(--card2) 66%,var(--up) 100%);margin:6px 0}
.dot{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--tx);border:2px solid var(--bg);transform:translateX(-50%)}
.lv{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
table{width:100%;border-collapse:collapse}

.seg{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}

.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}

#detail .back{background:var(--card2);border:0;color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:18px}
.chart{height:360px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:12px 0;background:var(--card)}

.chead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px}.chead h1{font-size:30px;font-weight:800}

.tabs2{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}.tabs2 button{flex:0 0 auto;background:none;border:0;color:var(--mut);font-size:17px;font-weight:700;padding:10px 16px;border-radius:16px}

.pact{display:flex;gap:10px;align-items:center;margin-top:12px}.pill{border:1px solid var(--line);border-radius:22px;padding:7px 16px;display:flex;gap:8px;align-items:center;background:none;color:var(--tx);font-size:16px;font-weight:600}
.pill.on{color:var(--acc2);border-color:var(--acc2);background:rgba(123,63,228,.12)}.pill0{background:none;border:0;color:var(--tx);font-size:16px;font-weight:600;padding:7px 10px;display:flex;gap:8px;align-items:center}
.dirb{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px}.dl{background:rgba(22,199,132,.15);color:var(--up)}.ds{background:rgba(234,57,67,.15);color:var(--dn)}.dn0{background:var(--card2);color:var(--mut)}
.prem{background:var(--tx);color:var(--bg);font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;transform:skewX(-10deg);display:inline-block;vertical-align:middle}
.fab{position:fixed;right:18px;bottom:84px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;border:0;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:7}
.prof{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:14px;margin-top:10px;justify-content:start}.stats div{display:flex;flex-direction:column;cursor:pointer;font-size:13px;white-space:nowrap}.stats b{font-size:19px}
.bio{font-size:16px;line-height:1.5;margin:16px 0 6px;white-space:pre-wrap}.joined{margin:12px 0;font-size:15px}

.followbtn{width:100%;background:var(--tx);color:var(--bg);border:0;border-radius:24px;padding:14px;font-size:17px;font-weight:700;margin-top:6px}.followbtn.ing{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.fb2{background:var(--tx);color:var(--bg);border:0;border-radius:18px;padding:7px 14px;font-weight:700;font-size:13px;flex:0 0 auto}.fb2.ing{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.urow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.lvls div{background:var(--card2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;font-size:12px}.lvls b{font-size:16px}
.cm{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ctext{white-space:pre-wrap;font-size:15px;margin-top:2px}.cmav{cursor:pointer}
.cbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:11}
.cbar textarea{flex:1;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-size:15px;font-family:inherit;resize:none;max-height:120px}
.form label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:600}.form input,.form textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px;font-family:inherit}
.lv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.imgpick{display:block!important;text-align:center;border:1px dashed var(--line);border-radius:14px;padding:16px!important;margin-top:14px!important;color:var(--tx)!important;cursor:pointer;font-size:15px!important}
#sheet{position:fixed;inset:0;z-index:30;display:none}.shbg{position:absolute;inset:0;background:rgba(0,0,0,.5)}.sh{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom))}
.sh button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);font-size:17px;padding:15px 14px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:40;display:none;max-width:90%;text-align:center}
.cover{height:150px;margin:0 -18px;background:linear-gradient(135deg,#3b1d72,#1f3a8a) center/cover no-repeat}
.ecv{margin:12px 0 0;border-radius:16px;position:relative}.cvbtn{position:absolute!important;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff!important;border-radius:16px;padding:7px 12px!important;margin:0!important;font-size:13px!important;cursor:pointer}
.avring{border-radius:50%;padding:4px;background:var(--card);display:inline-block}.avcam{position:absolute;right:4px;bottom:4px;background:var(--acc);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:16px}
.vbox{background:#000}.pimg.big.vbox .tchip{top:10px;bottom:auto}.vbox video{width:100%;height:100%;object-fit:contain;display:block;background:#000}.pimg.big.vbox{aspect-ratio:auto}.pimg.big video{max-height:70vh}
.vplay{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.car .cart{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}.car .cart img{flex:0 0 100%;scroll-snap-align:start;object-fit:cover}.pimg.big.car{aspect-ratio:4/3}
.cnt{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.mcell{position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;background:var(--card2);cursor:pointer}

.fcols{columns:2;column-gap:18px}.fsec{break-inside:avoid;margin-bottom:6px}.fprof div{margin:6px 0;font-size:15px}.fdesc{margin-top:12px;font-size:15px;line-height:1.6;color:var(--tx)}

async function load(){
  let denied=false;
  for(const u of DATA_URLS){if(u.startsWith("__"))continue;
    try{const hd=u.startsWith("/")?{"X-Init-Data":(tg&&tg.initData)||""}:{};
      const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",headers:hd});
      if(r.status===403){denied=true;break}
      if(r.ok){D=await r.json();break}}catch(e){}}
  if(denied){$("#main").innerHTML='<div class="empty">🔒 Bu ilova faqat obunachilar uchun.<br><br>Botda «📝 Obuna bo\'lish» tugmasini bosing va ilovani bot menyusidagi «📱 Ilova» tugmasi orqali oching.</div>';$("#upd").textContent="";return}
  if(!D){$("#main").innerHTML='<div class="empty">⏳ Ma\'lumot hali kelmagan — bot birinchi ma\'lumotni 1–2 daqiqada yuboradi.<br><br>Sahifa o\'zi yangilanadi.</div>';$("#upd").textContent="";setTimeout(load,20000);return}
  {const u=String(D.updated||"").split(" ");$("#upd").textContent=u.length>=2?"🕒 "+u[1]:"";}

function strip(){

  if(D.fear)it.push(`<div class="mk"><div class="n">😨 Qo'rquv indeksi</div><div class="v">${Math.round(D.fear.score)}/100 <span class="mut">${esc(D.fear.label)}</span></div></div>`);
  $("#strip").innerHTML=it.join("");

function sigCard(s){
  const p=s.price||s.entry,lo=s.stop,hi=s.target,pos=Math.max(0,Math.min(100,(p-lo)/(hi-lo)*100));
  const res=s.status==="open"?pct(s.price?(s.price/s.entry-1)*100:null):pct(s.pnl);
  const rc=s.status==="open"?cls(s.price-s.entry):cls(s.pnl);
  return `<div class="card sig" data-t="${esc(s.t)}"><div class="row"><div><div class="tk">${esc(s.t)}</div><div class="mut" style="font-size:12px">${esc(s.entry_date)}${s.closed_date?" → "+esc(s.closed_date):""}</div></div>
  <div><div class="px">${money(p)}</div><div class="${rc}" style="text-align:right;font-weight:700">${res} <span class="mut" style="font-weight:400;font-size:11px">${s.status==="open"?"kirishdan":"natija"}</span></div></div></div>
  <div class="badges"><span class="b kind">${esc(s.kind_name||s.kind)}</span><span class="b st-${s.status==="open"?"open":s.pnl>0?"win":"loss"}">${STN[s.status]||s.status}${s.partial?" · 💰1-qism":""}</span>${s.halal?`<span class="b notr ${HB[s.halal]||""}">☪️ ${esc(T(s.halal))}</span>`:""}</div>
  <div class="lvl"><div class="bar"><span class="dot" style="left:${pos}%"></span></div><div class="lv"><span>🛑 ${money(lo)}</span><span>Kirish ${money(s.entry)}</span><span>🎯 ${money(hi)}</span></div></div></div>`;
}
function render(){
  if(!D){load();return}

  const m=$("#main");let h="";
  if(Q){const q=Q.toUpperCase().replace(/^\$/,"");const r=(D.quotes||[]).filter(x=>x.t.startsWith(q)).slice(0,30);

    let sg=symMatch(Q.replace(/^\$/,""),8);
    if(/^[A-Z][A-Z0-9.\-]{0,9}$/.test(q)&&!sg.some(x=>x[0]===q))sg.unshift([q,""]);
    if(sg.length&&sg[0][0]===q&&(SYMS||[]).some(x=>x[0]===q))prefetch(q);   // faqat to'liq tiker yozilganda oldindan yuklash
    h+=`<div class="sugg notr">${sg.map((x,k)=>`<div class="sg ${k===0?"first":""}" data-sym="${esc(x[0])}"><div class="sgi">${esc(x[0][0])}</div><div style="flex:1;min-width:0"><div class="sgt">${esc(x[0])}</div><div class="sgn">${esc(x[1]||"📈 Grafik va texnik tahlil")}</div></div><div class="sga">›</div></div>`).join("")}</div>`;
    if(r.length)h+=`<h2 style="font-size:14px">Bot skaneridagi aksiyalar</h2>`+quoteTable(r);
    m.innerHTML=h;bind();m.querySelectorAll(".sg[data-sym]").forEach(e=>e.onclick=()=>{$("#q").blur();openDetail(e.dataset.sym)});return}
  if(TAB==="sig"){
    const all=D.signals||[];const L=SF==="open"?all.filter(s=>s.status==="open"):all.filter(s=>s.status!=="open");
    h+=`<h2>Bot signallari</h2><div class="seg"><button data-sf="open" class="${SF==="open"?"on":""}">Faol (${all.filter(s=>s.status==="open").length})</button><button data-sf="closed" class="${SF==="closed"?"on":""}">Yopilgan</button><button data-sf="res" class="${SF==="res"?"on":""}">🏆 Natijalar</button></div>`;
    if(SF==="res")h+=results();

  else{const L=(D.halal||[]).filter(x=>x.v===HF);
    h+=`<h2>Halollik (AAOIFI + boykot)</h2><div class="seg">${["HALOL","SHUBHALI","HAROM"].map(v=>`<button data-hf="${v}" class="notr ${HF===v?"on":""}">${esc(T(v))} (${(D.halal||[]).filter(x=>x.v===v).length})</button>`).join("")}</div>`;
    h+=L.length?L.map(x=>`<div class="card q" data-t="${esc(x.t)}"><div class="row"><div class="tk">${esc(x.t)}</div><span class="b notr ${HB[x.v]}">${esc(T(x.v))}</span></div><div class="mut" style="margin-top:6px;font-size:12px">${esc(x.r)}</div></div>`).join(""):`<div class="empty">Ro'yxat bo'sh</div>`;
    h+=`<div class="disc">Halollik bot hisobi (AAOIFI mezonlari + boykot ro'yxati). Yakuniy qaror — o'zingiz va ishongan olimingizda.</div>`}

}
function ago(ts){if(!ts)return"";const s=Date.now()/1000-ts;const v=s<3600?[Math.max(1,Math.round(s/60)),"m"]:s<86400?[Math.round(s/3600),"h"]:[Math.round(s/86400),"d"];return `<span class="notr">${v[0]} ${esc(T(v[1]))}</span>`}

async function translate(q,sl,tl){

  try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+sl+"&tl="+tl+"&q="+encodeURIComponent(q));

function rankYou(X){const fw=new Set(((X.users[MEID]||{}).fw)||[]);const now=Date.now()/1000;
  return X.posts.slice().sort((a,b)=>{const sc=p=>(1+p.rk.length*2+p.cm.length*3+(p.ed?8:0)+(fw.has(p.uid)?5:0)+(p.pend?50:0))/Math.pow((now-p.ts)/3600+2,1.25);return sc(b)-sc(a)})}
function sugUsers(X,n){return Object.entries(X.users).filter(([k])=>k!==MEID).map(([k,U])=>[k,U,X.posts.filter(p=>p.uid===k).length,(U.fol||[]).length]).filter(x=>x[2]>0).sort((a,b)=>b[3]*3+b[2]-(a[3]*3+a[2])).slice(0,n)}

function bindCom(root){root=root||document;

  root.querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>openPost(e.dataset.open));
  root.querySelectorAll(".pc .vbox").forEach(e=>e.onclick=()=>openPost(e.closest(".pc").dataset.pid));
  root.querySelectorAll(".ph[data-uid],.urow[data-uid]").forEach(e=>e.onclick=ev=>{if(ev.target.closest("[data-fl]"))return;openProfile(e.dataset.uid)});

  root.querySelectorAll("[data-menu]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();postMenu(e.dataset.menu)});

  const f=root.querySelector("#fab");if(f)f.onclick=openCompose;

}
