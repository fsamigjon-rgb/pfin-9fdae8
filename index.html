<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--tx:#e8eaf0;--mut:#8b93a7;--line:#262b36;--acc:#7b3fe4;--acc2:#a477ff;--up:#16c784;--dn:#ea3943;--warn:#f5a623}
:root[data-theme="light"]{--bg:#f4f5f8;--card:#fff;--card2:#f0f1f5;--tx:#141821;--mut:#5f6678;--line:#e3e5ec;--acc:#6001d2;--acc2:#7b3fe4;--up:#0a9e5e;--dn:#d8262f;--warn:#c27a00}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:70px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:20px;letter-spacing:-.3px}.logo b{color:var(--acc2)}
.upd{font-size:12px;color:var(--mut);white-space:nowrap;flex:0 0 auto}.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.mrow .upd{padding:8px 16px 0 0}.mrow .mstate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{margin-top:10px;display:flex;align-items:center;background:var(--card2);border-radius:22px;padding:0 14px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);padding:10px 8px;font-size:15px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:104px}
.chip .s{font-weight:700;font-size:13px}.chip .p{font-size:13px}.chip .c{font-size:12px;font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
main{padding:0 16px}
h2{font-size:17px;margin:16px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.sig{cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tk{font-weight:800;font-size:17px}
.px{font-weight:700;font-size:16px;text-align:right}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--mut)}
.b.halol{background:rgba(22,199,132,.15);color:var(--up)}.b.harom{background:rgba(234,57,67,.15);color:var(--dn)}.b.shubhali{background:rgba(245,166,35,.15);color:var(--warn)}
.b.kind{background:rgba(123,63,228,.18);color:var(--acc2)}
.b.st-open{background:rgba(123,63,228,.12);color:var(--acc2)}.b.st-win{background:rgba(22,199,132,.15);color:var(--up)}.b.st-loss{background:rgba(234,57,67,.15);color:var(--dn)}
.lvl{margin-top:12px}
.bar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--dn) 0%,var(--card2) 33%,var(--card2) 66%,var(--up) 100%);margin:6px 0}
.dot{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--tx);border:2px solid var(--bg);transform:translateX(-50%)}
.lv{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--mut);text-align:right;font-weight:600;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}
tr.q{cursor:pointer}
.seg{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);padding:6px 12px;border-radius:18px;font-size:12px;font-weight:600}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px}nav button.on{color:var(--acc2)}
.fear{display:flex;align-items:center;gap:14px}
.gauge{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px}
#detail{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;display:none;padding-bottom:30px}
#detail .top{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
#detail .back{background:var(--card2);border:0;color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:18px}
.chart{height:360px;border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:12px 0;background:var(--card)}
.chart iframe{width:100%;height:100%;border:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.grid2 div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;font-size:13px}
.pre{white-space:pre-wrap;font-size:13px;color:var(--tx)}
.disc{font-size:11px;color:var(--mut);margin:18px 0 8px;text-align:center}
.empty{color:var(--mut);text-align:center;padding:30px 0}
svg.curve{width:100%;height:120px;display:block}
.langsel{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:6px 10px;font-size:13px;font-weight:700;max-width:150px}
.av{border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
.chead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px}.chead h1{font-size:30px;font-weight:800}
.ib{background:none;border:0;color:var(--tx);font-size:22px;padding:4px}
.tabs2{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}.tabs2 button{flex:0 0 auto;background:none;border:0;color:var(--mut);font-size:17px;font-weight:700;padding:10px 16px;border-radius:16px}
.tabs2 button.on{background:var(--tx);color:var(--bg)}
.pc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.ph{display:flex;gap:12px;align-items:center;cursor:pointer}.pn{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pdate{color:var(--mut);font-size:13px;margin-top:2px}
.pimg{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:12px 0;background:linear-gradient(180deg,#160c26,#24123b);aspect-ratio:16/9;cursor:pointer}
.pimg.big{aspect-ratio:auto;min-height:200px}.pimg img{width:100%;height:100%;object-fit:cover;display:block}.pimg.big img{height:auto;object-fit:contain}.pimg svg{width:100%;height:100%;display:block}
.tchip{position:absolute;left:10px;bottom:10px;background:rgba(36,36,44,.88);color:#fff;border-radius:22px;padding:4px 14px 4px 4px;display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.tchip i{width:28px;height:28px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}
.ptitle{font-size:19px;font-weight:800;line-height:1.3;cursor:pointer}.ptext{white-space:pre-wrap;font-size:15px;line-height:1.55;margin:10px 0}
.pact{display:flex;gap:10px;align-items:center;margin-top:12px}.pill{border:1px solid var(--line);border-radius:22px;padding:7px 16px;display:flex;gap:8px;align-items:center;background:none;color:var(--tx);font-size:16px;font-weight:600}
.pill.on{color:var(--acc2);border-color:var(--acc2);background:rgba(123,63,228,.12)}.pill0{background:none;border:0;color:var(--tx);font-size:16px;font-weight:600;padding:7px 10px;display:flex;gap:8px;align-items:center}
.dirb{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px}.dl{background:rgba(22,199,132,.15);color:var(--up)}.ds{background:rgba(234,57,67,.15);color:var(--dn)}.dn0{background:var(--card2);color:var(--mut)}
.prem{background:var(--tx);color:var(--bg);font-size:11px;font-weight:800;padding:2px 7px;border-radius:4px;transform:skewX(-10deg);display:inline-block;vertical-align:middle}
.fab{position:fixed;right:18px;bottom:84px;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;border:0;box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:7}
.prof{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:14px;margin-top:10px;justify-content:start}.stats div{display:flex;flex-direction:column;cursor:pointer;font-size:13px;white-space:nowrap}.stats b{font-size:19px}
.bio{font-size:16px;line-height:1.5;margin:16px 0 6px;white-space:pre-wrap}.joined{margin:12px 0;font-size:15px}
.socs{display:flex;gap:12px;margin:10px 0 16px}.soc{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--tx);text-decoration:none;font-size:20px;font-weight:800}
.followbtn{width:100%;background:var(--tx);color:var(--bg);border:0;border-radius:24px;padding:14px;font-size:17px;font-weight:700;margin-top:6px}.followbtn.ing{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.fb2{background:var(--tx);color:var(--bg);border:0;border-radius:18px;padding:7px 14px;font-weight:700;font-size:13px;flex:0 0 auto}.fb2.ing{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.urow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.lvls div{background:var(--card2);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;font-size:12px}.lvls b{font-size:16px}
.cm{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.ctext{white-space:pre-wrap;font-size:15px;margin-top:2px}.cmav{cursor:pointer}
.cbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:11}
.cbar textarea{flex:1;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-size:15px;font-family:inherit;resize:none;max-height:120px}
.form label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:600}.form input,.form textarea{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px;font-family:inherit}
.lv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.imgpick{display:block!important;text-align:center;border:1px dashed var(--line);border-radius:14px;padding:16px!important;margin-top:14px!important;color:var(--tx)!important;cursor:pointer;font-size:15px!important}
#sheet{position:fixed;inset:0;z-index:30;display:none}.shbg{position:absolute;inset:0;background:rgba(0,0,0,.5)}.sh{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom))}
.sh button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);font-size:17px;padding:15px 14px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;z-index:40;display:none;max-width:90%;text-align:center}
.cover{height:150px;margin:0 -18px;background:linear-gradient(135deg,#3b1d72,#1f3a8a) center/cover no-repeat}
.ecv{margin:12px 0 0;border-radius:16px;position:relative}.cvbtn{position:absolute!important;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff!important;border-radius:16px;padding:7px 12px!important;margin:0!important;font-size:13px!important;cursor:pointer}
.avring{border-radius:50%;padding:4px;background:var(--card);display:inline-block}.avcam{position:absolute;right:4px;bottom:4px;background:var(--acc);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:16px}
.vbox{background:#000}.pimg.big.vbox .tchip{top:10px;bottom:auto}.vbox video{width:100%;height:100%;object-fit:contain;display:block;background:#000}.pimg.big.vbox{aspect-ratio:auto}.pimg.big video{max-height:70vh}
.vplay{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.car .cart{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}.car .cart img{flex:0 0 100%;scroll-snap-align:start;object-fit:cover}.pimg.big.car{aspect-ratio:4/3}
.cnt{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.mcell{position:relative;aspect-ratio:1;overflow:hidden;border-radius:8px;background:var(--card2);cursor:pointer}
.mcell img,.mcell video{width:100%;height:100%;object-fit:cover;display:block}.mcell span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:28px;text-shadow:0 2px 8px #000}
.mcell b{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
#imgv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;align-items:center;justify-content:center}#imgv img{max-width:100%;max-height:100%}#imgv button{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px}
.fcols{columns:2;column-gap:18px}.fsec{break-inside:avoid;margin-bottom:6px}.fprof div{margin:6px 0;font-size:15px}.fdesc{margin-top:12px;font-size:15px;line-height:1.6;color:var(--tx)}
@media(max-width:360px){.fcols{columns:1}}
.sugg{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0}
.sg{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}.sg:last-child{border-bottom:0}.sg.first{background:rgba(123,63,228,.1)}
.sgi{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;flex:0 0 auto}.sgt{font-weight:800;font-size:16px}.sgn{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sga{color:var(--mut);font-size:20px}
.skel{border-radius:16px;margin:12px 0;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.2s infinite linear}@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pfc{position:relative;margin-top:14px}.pfb{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pfh{font-size:19px;font-weight:800;margin:2px 44px 10px 0}.fsub{font-size:14px;font-weight:800;color:var(--acc2);margin:14px 0 4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}.frow{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}.frow b{text-align:right}
.btn2{display:block;text-align:center;margin-top:12px;padding:10px;border-radius:12px;background:var(--card2);color:var(--tx);text-decoration:none;font-weight:700}
.pfc-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:12px 0;position:relative}
.pfc-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding:8px;border-bottom:1px solid var(--line)}

<script>
const DATA_URLS=["https://raw.githubusercontent.com/fsamigjon-rgb/pfin-9fdae8/main/data.json","data.json"];
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();if(tg.colorScheme==="light")document.documentElement.dataset.theme="light"}
else if(matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.dataset.theme="light";
let D=null,TAB="home",SF="open",MS={k:"c",d:-1},MF="all",HF="HALOL",Q="";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=v=>v==null?"—":"$"+(v<2?v.toFixed(4):v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
const pct=v=>v==null?"—":(v>0?"+":"")+v.toFixed(2)+"%";
const cls=v=>v>0?"up":v<0?"dn":"mut";
const HB={HALOL:"halol",HAROM:"harom",SHUBHALI:"shubhali"};
const STN={open:"Faol",win:"Target",loss:"Stop",timeout:"Muddat",be:"1-qism+BE"};
async function load(){
  let denied=false;
  for(const u of DATA_URLS){if(u.startsWith("__"))continue;
    try{const hd=u.startsWith("/")?{"X-Init-Data":(tg&&tg.initData)||""}:{};
      const r=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",headers:hd});
      if(r.status===403){denied=true;break}
      if(r.ok){D=await r.json();break}}catch(e){}}
  if(denied){$("#main").innerHTML='<div class="empty">🔒 Bu ilova faqat obunachilar uchun.<br><br>Botda «📝 Obuna bo\'lish» tugmasini bosing va ilovani bot menyusidagi «📱 Ilova» tugmasi orqali oching.</div>';$("#upd").textContent="";return}
  if(!D){$("#main").innerHTML='<div class="empty">⏳ Ma\'lumot hali kelmagan — bot birinchi ma\'lumotni 1–2 daqiqada yuboradi.<br><br>Sahifa o\'zi yangilanadi.</div>';$("#upd").textContent="";setTimeout(load,20000);return}
  {const u=String(D.updated||"").split(" ");$("#upd").textContent=u.length>=2?"🕒 "+u[1]:"";}
  if(D.acl&&!(await aclOk())){lockScreen();return}
  mstate();
  strip();render();
}
let CTIER="trial";
async function aclOk(){try{if(!MEID)return false;const h=(await sha256hex(D.acl.s+":"+MEID)).slice(0,20);CTIER=(D.acl.t||{})[h]||"basic";return (D.acl.h||[]).includes(h)}catch(e){return false}}
function lockScreen(){document.querySelector("nav").style.display="none";const sb=document.querySelector(".search");if(sb)sb.style.display="none";
  $("#strip").innerHTML="";$("#mstate").innerHTML="";
  $("#main").innerHTML=`<div class="card" style="margin-top:30px;text-align:center;padding:28px 20px"><div style="font-size:54px">🔒</div>
  <div style="font-size:22px;font-weight:800;margin:10px 0">Penny Finance — faqat obunachilar uchun</div>

  const b=$("#lkb");if(b)b.onclick=()=>{try{tg.close()}catch(e){}};
  clearTimeout(window._lkT);window._lkT=setTimeout(async()=>{D=null;await load();if(!document.querySelector("#lkb")){document.querySelector("nav").style.display="";const sb=document.querySelector(".search");if(sb)sb.style.display=""}},30000)}
function mstate(){if(!D)return;const ic={open:"🟢",pre:"🌅",post:"🌙",closed:"🌙"}[D.market_state]||"";
  $("#mstate").innerHTML=`<span class="notr" style="color:var(--tx);font-weight:700">${esc(T("um"))}</span> <span class="notr">· ${ic} ${esc(T(D.market_state)||"")}</span>`}
function strip(){
  const fmt=v=>v==null?"—":v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:v<10?4:2});
  const src=(D.markets&&D.markets.length)?D.markets:(D.index||[]).map(x=>({n:x.t,p:x.p,c:x.c}));
  const it=src.map(x=>`<div class="mk" data-mk="${esc(x.s||x.n)}" data-mn="${esc(x.n)}"><div class="n">${esc(x.n)}</div><div class="v">${fmt(x.p)} <span class="${cls(x.c)}">${pct(x.c)}</span></div></div>`);
  if(D.fear)it.push(`<div class="mk"><div class="n">😨 Qo'rquv indeksi</div><div class="v">${Math.round(D.fear.score)}/100 <span class="mut">${esc(D.fear.label)}</span></div></div>`);
  $("#strip").innerHTML=it.join("");
  document.querySelectorAll("[data-mk]").forEach(e=>e.onclick=()=>openMarket(e.dataset.mk,e.dataset.mn));
}
function sigCard(s){
  const p=s.price||s.entry,lo=s.stop,hi=s.target,pos=Math.max(0,Math.min(100,(p-lo)/(hi-lo)*100));
  const res=s.status==="open"?pct(s.price?(s.price/s.entry-1)*100:null):pct(s.pnl);
  const rc=s.status==="open"?cls(s.price-s.entry):cls(s.pnl);
  return `<div class="card sig" data-t="${esc(s.t)}"><div class="row"><div><div class="tk">${esc(s.t)}</div><div class="mut" style="font-size:12px">${esc(s.entry_date)}${s.closed_date?" → "+esc(s.closed_date):""}</div></div>
  <div><div class="px">${money(p)}</div><div class="${rc}" style="text-align:right;font-weight:700">${res} <span class="mut" style="font-weight:400;font-size:11px">${s.status==="open"?"kirishdan":"natija"}</span></div></div></div>
  <div class="badges"><span class="b kind">${esc(s.kind_name||s.kind)}</span><span class="b st-${s.status==="open"?"open":s.pnl>0?"win":"loss"}">${STN[s.status]||s.status}${s.partial?" · 💰1-qism":""}</span>${s.halal?`<span class="b notr ${HB[s.halal]||""}">☪️ ${esc(T(s.halal))}</span>`:""}</div>
  <div class="lvl"><div class="bar"><span class="dot" style="left:${pos}%"></span></div><div class="lv"><span>🛑 ${money(lo)}</span><span>Kirish ${money(s.entry)}</span><span>🎯 ${money(hi)}</span></div></div></div>`;
}
function render(){
  if(!D){load();return}
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB));
  const m=$("#main");let h="";
  if(Q){const q=Q.toUpperCase().replace(/^\$/,"");const r=(D.quotes||[]).filter(x=>x.t.startsWith(q)).slice(0,30);
    if(!SYMS)loadSyms().then(()=>{if(Q)render()});
    let sg=symMatch(Q.replace(/^\$/,""),8);
    if(/^[A-Z][A-Z0-9.\-]{0,9}$/.test(q)&&!sg.some(x=>x[0]===q))sg.unshift([q,""]);
    if(sg.length&&sg[0][0]===q&&(SYMS||[]).some(x=>x[0]===q))prefetch(q);   // faqat to'liq tiker yozilganda oldindan yuklash
    h+=`<div class="sugg notr">${sg.map((x,k)=>`<div class="sg ${k===0?"first":""}" data-sym="${esc(x[0])}"><div class="sgi">${esc(x[0][0])}</div><div style="flex:1;min-width:0"><div class="sgt">${esc(x[0])}</div><div class="sgn">${esc(x[1]||"📈 Grafik va texnik tahlil")}</div></div><div class="sga">›</div></div>`).join("")}</div>`;
    if(r.length)h+=`<h2 style="font-size:14px">Bot skaneridagi aksiyalar</h2>`+quoteTable(r);
    m.innerHTML=h;bind();m.querySelectorAll(".sg[data-sym]").forEach(e=>e.onclick=()=>{$("#q").blur();openDetail(e.dataset.sym)});return}

function iSMA(a,n){const o=Array(a.length).fill(null);let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];if(i>=n-1)o[i]=s/n}return o}
function iEMA(a,n){const o=Array(a.length).fill(null);const k=2/(n+1);let e=null;for(let i=0;i<a.length;i++){if(i===n-1){let s=0;for(let j=0;j<n;j++)s+=a[j];e=s/n}else if(i>=n)e=a[i]*k+e*(1-k);if(i>=n-1)o[i]=e}return o}
function iRSI(c,n=14){const o=Array(c.length).fill(null);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],u=Math.max(d,0),w=Math.max(-d,0);if(i<=n){g+=u;l+=w;if(i===n){g/=n;l/=n;o[i]=l===0?100:100-100/(1+g/l)}}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+w)/n;o[i]=l===0?100:100-100/(1+g/l)}}return o}
function iMACD(c){const a=iEMA(c,12),b=iEMA(c,26);const m=c.map((_,i)=>a[i]!=null&&b[i]!=null?a[i]-b[i]:null);const st=m.findIndex(x=>x!=null);const sg=Array(c.length).fill(null);if(st>=0){const e=iEMA(m.slice(st),9);e.forEach((x,i)=>sg[st+i]=x)}return {m,s:sg,h:m.map((x,i)=>x!=null&&sg[i]!=null?x-sg[i]:null)}}
function iStoch(h,l,c,n=14){const k=c.map((x,i)=>{if(i<n-1)return null;let hh=-1e18,ll=1e18;for(let j=i-n+1;j<=i;j++){hh=Math.max(hh,h[j]);ll=Math.min(ll,l[j])}return hh===ll?50:(x-ll)/(hh-ll)*100});const ks=iSMAn(k,3);return {k:ks,d:iSMAn(ks,3)}}
function iSMAn(a,n){return a.map((_,i)=>{if(i<n-1)return null;let s=0;for(let j=i-n+1;j<=i;j++){if(a[j]==null)return null;s+=a[j]}return s/n})}
function iCCI(h,l,c,n=20){const tp=c.map((x,i)=>(h[i]+l[i]+x)/3);return tp.map((x,i)=>{if(i<n-1)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=tp[j];const m=s/n;let d=0;for(let j=i-n+1;j<=i;j++)d+=Math.abs(tp[j]-m);d/=n;return d?(x-m)/(0.015*d):0})}
function iWR(h,l,c,n=14){return c.map((x,i)=>{if(i<n-1)return null;let hh=-1e18,ll=1e18;for(let j=i-n+1;j<=i;j++){hh=Math.max(hh,h[j]);ll=Math.min(ll,l[j])}return hh===ll?-50:(hh-x)/(hh-ll)*-100})}
function iBB(c,n=20,k=2){const m=iSMA(c,n);return c.map((_,i)=>{if(m[i]==null)return null;let v=0;for(let j=i-n+1;j<=i;j++)v+=(c[j]-m[i])**2;const sd=Math.sqrt(v/n);return [m[i]+k*sd,m[i]-k*sd]})}
function toWeekly(H){const W={d:[],o:[],h:[],l:[],c:[],v:[]};let key=null;H.d.forEach((d,i)=>{const t=new Date(d+"T00:00:00Z");const mon=new Date(t.getTime()-((t.getUTCDay()+6)%7)*864e5).toISOString().slice(0,10);if(mon!==key){key=mon;W.d.push(d);W.o.push(H.o[i]);W.h.push(H.h[i]);W.l.push(H.l[i]);W.c.push(H.c[i]);W.v.push(H.v[i]||0)}else{const j=W.c.length-1;W.h[j]=Math.max(W.h[j],H.h[i]);W.l[j]=Math.min(W.l[j],H.l[i]);W.c[j]=H.c[i];W.v[j]+=H.v[i]||0}});return W}
function taRate(H){
  const c=H.c,h=H.h,l=H.l,n=c.length,L=n-1,px=c[L];const osc=[],mas=[];
  const act=v=>v>0?"buy":v<0?"sell":"neu";
  const r=iRSI(c);if(r[L]!=null)osc.push(["RSI (14)",r[L],act(r[L]<30&&r[L]>r[L-1]?1:r[L]>70&&r[L]<r[L-1]?-1:0)]);
  const st=iStoch(h,l,c);if(st.k[L]!=null&&st.d[L]!=null)osc.push(["Stochastic %K (14,3,3)",st.k[L],act(st.k[L]<20&&st.k[L]>st.d[L]?1:st.k[L]>80&&st.k[L]<st.d[L]?-1:0)]);
  const cc=iCCI(h,l,c);if(cc[L]!=null)osc.push(["CCI (20)",cc[L],act(cc[L]<-100&&cc[L]>cc[L-1]?1:cc[L]>100&&cc[L]<cc[L-1]?-1:0)]);
  const md=iMACD(c);if(md.m[L]!=null&&md.s[L]!=null)osc.push(["MACD (12,26)",md.m[L],act(md.m[L]>md.s[L]?1:-1)]);

  const wr=iWR(h,l,c);if(wr[L]!=null)osc.push(["Williams %R (14)",wr[L],act(wr[L]<-80&&wr[L]>wr[L-1]?1:wr[L]>-20&&wr[L]<wr[L-1]?-1:0)]);
  const bb=iBB(c);if(bb[L])osc.push(["Bollinger (20,2)",(px-bb[L][1])/((bb[L][0]-bb[L][1])||1)*100,act(px<bb[L][1]?1:px>bb[L][0]?-1:0)]);
  for(const p of [10,20,30,50,100,200]){const e=iEMA(c,p)[L],s=iSMA(c,p)[L];if(e!=null)mas.push([`EMA (${p})`,e,act(px>e?1:px<e?-1:0)]);if(s!=null)mas.push([`SMA (${p})`,s,act(px>s?1:px<s?-1:0)])}
  const sc=a=>{const b=a.filter(x=>x[2]==="buy").length,s=a.filter(x=>x[2]==="sell").length,u=a.length-b-s;return {b,s,u,r:a.length?(b-s)/a.length:0}};
  const so=sc(osc),sm=sc(mas),all=sc(osc.concat(mas));return {osc,mas,so,sm,all};
}

function gaugeSvg(r,big){const W=big?220:120,cx=W/2,cy=W/2,R=W/2-10;const seg=(a0,a1,col)=>{const p=a=>[cx+R*Math.cos(a),cy-R*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${col}" stroke-width="${big?9:6}" fill="none" stroke-linecap="round"/>`};
  const cols=["var(--dn)","#c0545b","var(--mut)","#4f7cf0","#2f6bff"];let s="";for(let i=0;i<5;i++){const a0=Math.PI-(i*Math.PI/5)-0.06,a1=Math.PI-((i+1)*Math.PI/5)+0.06;s+=seg(a0,a1,cols[i])}

function lowest(a,n){const o=mk(a.length);for(let i=n-1;i<a.length;i++){let h=Infinity;for(let j=0;j<n;j++){const v=a[i-j];if(!isn(v)&&v<h)h=v}o[i]=h===Infinity?N:h}return o}

  const s=this.sheet(`<div class="pfc-sh-h"><b>ƒx Indikatorlar</b><span class="mut">${this.inds.length}/${this.limit}</span><button class="pfc-cl">✕</button></div>
   <input class="pfc-q" placeholder="🔎 Qidirish: RSI, MACD, Bollinger…">
   ${this.inds.length>=this.limit?`<div class="pfc-warn">${this.limitMsg()}</div>`:""}
   <div class="pfc-list"><div class="pfc-g">⭐ Mening indikatorlarim (o'z formulam)</div>
   ${my.map((m,i)=>`<div class="pfc-it" data-my="${i}"><span>📝 ${esc(m.nm||"Indikator")}</span><button data-ed="${i}">✏️</button><button data-del="${i}">🗑</button></div>`).join("")}
   <div class="pfc-it pfc-new" data-new="1">＋ Yangi indikator yozish (formula/kod)</div>
   ${Object.entries(G).map(([g,a])=>`<div class="pfc-g">${g}</div>`+a.map(([k,d])=>`<div class="pfc-it" data-k="${k}"><span>${esc(d.n)}</span><em>${d.ov?"grafikda":"panelda"}</em></div>`).join("")).join("")}</div>`);
  const q=s.querySelector(".pfc-q");q.oninput=()=>{const v=q.value.toLowerCase();s.querySelectorAll(".pfc-it[data-k]").forEach(e=>e.style.display=e.textContent.toLowerCase().includes(v)?"":"none")};
  s.querySelector(".pfc-cl").onclick=()=>s.style.display="none";
  s.querySelectorAll("[data-k]").forEach(e=>e.onclick=()=>{const k=e.dataset.k,d=PFI.IND[k];if(this.add({k,p:Object.assign({},d.p),c:PFI.C[this.inds.length%PFI.C.length]}))s.style.display="none"});
  s.querySelectorAll("[data-my]").forEach(e=>e.onclick=ev=>{if(ev.target.closest("button"))return;const m=my[+e.dataset.my];if(this.add({k:"custom",src:m.src,nm:m.nm}))s.style.display="none"});
  s.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>this.editor(+b.dataset.ed));
  s.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{my.splice(+b.dataset.del,1);pfcSave("pf_scripts",my);this.indMenu()});
  s.querySelector("[data-new]").onclick=()=>this.editor(-1)}
 indEdit(k){const x=this.inds[k];if(!x)return;if(x.src){const my=pfcLoad("pf_scripts",[]);const i=my.findIndex(m=>m.src===x.src);this.editor(i,k);return}const d=PFI.IND[x.k];
  const s=this.sheet(`<div class="pfc-sh-h"><b>${esc(d.n)}</b><button class="pfc-cl">✕</button></div>
   ${Object.keys(d.p).map(p=>`<label class="pfc-lb">${esc({len:"Davr",mult:"Ko'paytuvchi",fast:"Tez",slow:"Sekin",sig:"Signal",k:"%K",d:"%D",pct:"Foiz",step:"Qadam",max:"Maks",t:"Tenkan",s:"Senkou"}[p]||p)}<input type="number" step="any" data-p="${p}" value="${x.p[p]}"></label>`).join("")}
   <label class="pfc-lb">Rang<input type="color" class="pfc-col" value="${(x.c||"#f5a623").slice(0,7)}"></label>
   <div style="display:flex;gap:8px;margin-top:12px"><button class="btn pfc-ok">Saqlash</button><button class="btn2 pfc-rm" style="margin:0">🗑 O'chirish</button></div>`);
  s.querySelector(".pfc-cl").onclick=()=>s.style.display="none";
  s.querySelector(".pfc-ok").onclick=()=>{s.querySelectorAll("[data-p]").forEach(i=>{const v=parseFloat(i.value);if(v>0&&v<1000)x.p[i.dataset.p]=v});x.c=s.querySelector(".pfc-col").value;this.save();this.calc();this.draw();s.style.display="none"};
  s.querySelector(".pfc-rm").onclick=()=>{this.inds.splice(k,1);this.save();this.calc();this.syncBar();this.draw();s.style.display="none"}}
 editor(i,activeK){const my=pfcLoad("pf_scripts",[]);const m=i>=0?my[i]:{nm:"",src:PFI.EXAMPLE};
  const s=this.sheet(`<div class="pfc-sh-h"><b>📝 O'z indikatoringiz</b><button class="pfc-cl">✕</button></div>
   <div class="mut" style="font-size:12px;margin-bottom:6px">Pine Script'ga o'xshash oddiy til. Kod faqat sizning ilovangizda saqlanadi.</div>
   <textarea class="pfc-code notr" spellcheck="false">${esc(m.src)}</textarea>
   <details class="pfc-help"><summary>📘 Qo'llanma</summary><pre class="notr">${esc(PFI.HELP)}</pre></details>
   <div class="pfc-err notr"></div>
   <div style="display:flex;gap:8px;margin-top:10px"><button class="btn2 pfc-test" style="margin:0">▶ Tekshirish</button><button class="btn pfc-sv">💾 Saqlash va qo'shish</button></div>`);
  const ta=s.querySelector(".pfc-code"),er=s.querySelector(".pfc-err");s.querySelector(".pfc-cl").onclick=()=>s.style.display="none";
  const test=()=>{try{if(!this.D)throw new Error("grafik ma'lumoti yo'q");const r=PFI.run(ta.value,this.D);er.style.color="var(--up)";er.textContent=`✅ To'g'ri: «${r.name}» — ${r.L.length} ta chiziq, ${r.ov?"grafik ustida":"alohida panelda"}`;return r}catch(e){er.style.color="var(--dn)";er.textContent="❌ "+e.message;return null}};
  s.querySelector(".pfc-test").onclick=test;
  s.querySelector(".pfc-sv").onclick=()=>{const r=test();if(!r)return;const it={nm:r.name,src:ta.value};if(i>=0)my[i]=it;else my.unshift(it);pfcSave("pf_scripts",my.slice(0,30));
   if(activeK!=null&&this.inds[activeK]){this.inds[activeK].src=ta.value;this.inds[activeK].nm=r.name;this.save();this.calc();this.draw();s.style.display="none";return}
   if(this.add({k:"custom",src:ta.value,nm:r.name}))s.style.display="none"}}
}
function alertBox(t){if(typeof toast==="function")toast(t);else alert(t)}

function closeDetail(){STACK=[];$("#detail").style.display="none";if(tg&&tg.BackButton)tg.BackButton.hide()}
function bind(){
  document.querySelectorAll("[data-n]").forEach(e=>e.onclick=()=>openArticle(+e.dataset.n));

  document.querySelectorAll("[data-t]").forEach(e=>e.onclick=()=>openDetail(e.dataset.t));
  document.querySelectorAll("[data-sf]").forEach(e=>e.onclick=()=>{SF=e.dataset.sf;render()});
  document.querySelectorAll("[data-mf]").forEach(e=>e.onclick=()=>{MF=e.dataset.mf;render()});
  document.querySelectorAll("[data-hf]").forEach(e=>e.onclick=()=>{HF=e.dataset.hf;render()});
  document.querySelectorAll("th[data-k]").forEach(e=>e.onclick=()=>{const k=e.dataset.k;MS={k,d:MS.k===k?-MS.d:(k==="t"?1:-1)};render()});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;Q="";$("#q").value="";render();scrollTo(0,0)});
$("#q").oninput=e=>{Q=e.target.value.trim();if(D)render()};
$("#q").onkeydown=e=>{if(e.key==="Enter"&&Q){e.target.blur();const f=document.querySelector(".sg.first");openDetail(f?f.dataset.sym:Q.toUpperCase().replace(/^\$/,""))}};
$("#q").onfocus=()=>{loadSyms()};
load();setInterval(()=>{if($("#detail").style.display!=="block")load()},120000);
</script>
